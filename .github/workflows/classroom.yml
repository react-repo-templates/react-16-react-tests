name: Autograding Tests
"on":
  workflow_dispatch:
  repository_dispatch:
  push:
permissions:
  checks: write
  actions: read
  contents: read
jobs:
  run-autograding-tests:
    runs-on: ubuntu-latest
    # Skip the push that creates a repository from this template.
    # Later pushes, manual runs, and Classroom regrades still start the tests.
    if: >-
      github.actor != 'github-classroom[bot]' &&
      !(
        github.event_name == 'push' &&
        github.event.before == '0000000000000000000000000000000000000000' &&
        github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
      )
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    - name: Main test
      id: main-test
      uses: classroom-resources/autograding-command-grader@v1
      with:
        test-name: Main test
        setup-command: npm install
        command: npm test -- --watchAll=false --coverage
        timeout: 10
        max-score: 10
    - name: Autograding Reporter
      uses: classroom-resources/autograding-grading-reporter@v1
      env:
        MAIN-TEST_RESULTS: "${{steps.main-test.outputs.result}}"
      with:
        runners: main-test
